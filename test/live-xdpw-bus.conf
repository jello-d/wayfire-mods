<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- live-xdpw-bus.conf: the PRIVATE session bus test/live.t runs the portal
     backend on. NO service directories, deliberately: with the standard
     ones, a call that lands before the patched backend owns its name makes
     dbus-daemon start the DISTRO backend from /usr/share, and every later
     answer comes from the wrong binary. Measured: it did, in the first run. -->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
